name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/k8s-ai-monitor
  SYFT_VERSION: "1.52.0"
  SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
      id-token: write           # keyless signing (Sigstore, GitHub OIDC)
      attestations: write       # SLSA build provenance (actions/attest-build-provenance)
      artifact-metadata: write  # its storage record (registry link)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%s)
          BUILD_DATE=$(date -u +%Y%m%d-%H%M%S)
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
          VERSION="${VERSION#v}"

          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "full_tag=main-v${VERSION}-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.full_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=k8s-ai-monitor
            org.opencontainers.image.version=${{ steps.meta.outputs.full_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # The same supply-chain evidence as the backend and frontend images (Chapter 17): the cluster's
      # ImageValidatingPolicy admits ghcr.io/safeops-course images only with a signature and an SPDX SBOM
      # attestation from this repository's build.yml. All three are made for the pushed index's digest.
      # SLSA build provenance, signed by GitHub and pushed next to the image.
      # Verify: gh attestation verify oci://<image> --owner safeops-course
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # One SBOM per published platform, all attested to the index digest - the digest a tag resolves
      # to and admission verifies. syft scans one platform of a multi-platform image (linux/amd64 when
      # none is named), so a single SBOM described amd64 only, while kind on Apple silicon runs arm64.
      # Each SBOM names its platform in the image's package URL (pkg:oci/...?arch=arm64).
      - name: Generate and attach one SBOM attestation per platform
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # syft pinned and checksum-verified (this job holds packages:write and id-token:write).
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C /usr/local/bin syft
          rm "${archive}"
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          # The platforms the index holds - not attestation manifests (unknown/unknown).
          platforms="$(docker buildx imagetools inspect --raw "${image}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          [[ -n "${platforms}" ]] || { echo "::error::no platforms in the index ${image}"; exit 1; }
          for platform in ${platforms}; do  # one per line, no spaces: word splitting is the point
            arch="${platform#*/}"
            syft "${image}" --platform "${platform}" -o "spdx-json=sbom-${arch}.spdx.json"
            cosign attest --yes --predicate "sbom-${arch}.spdx.json" --type spdxjson "${image}"
          done
          echo "${platforms}" > platforms.txt

      # Fail loudly when a published platform has no SBOM that admission can read: the attestations are
      # verified the way the cluster does (this workflow's identity), and each one's architecture is
      # read from the image's package URL.
      - name: Every published platform has an SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          attested="$(cosign verify-attestation --type spdxjson "${image}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${IDENTITY}" 2>/dev/null \
            | jq -r '.payload' | base64 -d \
            | jq -r '.predicate.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:oci/"))
                | capture("arch=(?<a>[^&]+)").a' | sort -u)"
          expected="$(sed 's|.*/||' platforms.txt | sort -u)"
          echo "published: $(tr '\n' ' ' <<<"${expected}")  attested: $(tr '\n' ' ' <<<"${attested}")"
          if [[ "${attested}" != "${expected}" ]]; then
            echo "::error::SBOM attestations (${attested//$'\n'/ }) do not cover the published platforms (${expected//$'\n'/ })"
            exit 1
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.full_tag }}
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "0"

      - name: Output summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Supply chain:** cosign signature (keyless), SPDX SBOM attestation, SLSA build provenance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta.outputs.full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
