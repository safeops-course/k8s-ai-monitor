# Lint and tests on every pull request and push to main. build.yml only builds and
# scans the image - before this workflow, nothing in CI ran the test suite.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"   # = the Dockerfile's base image
          cache: pip

      - name: Install
        # Pinned like the pre-commit hook: a new release must not fail CI on unchanged code.
        run: pip install -r requirements.txt pytest==9.1.1 ruff==0.17.0

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest tests/ -q
